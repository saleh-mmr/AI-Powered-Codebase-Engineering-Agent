services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    environment: &backend_environment
      APP_DATABASE_URL: ${APP_DATABASE_URL:?Set APP_DATABASE_URL in .env}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_FRONTEND_ORIGIN: ${APP_FRONTEND_ORIGIN:-http://localhost:3000}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_SESSION_LIFETIME_HOURS: ${APP_SESSION_LIFETIME_HOURS:-24}
      APP_DATABASE_TIMEOUT_SECONDS: ${APP_DATABASE_TIMEOUT_SECONDS:-3}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build: ./backend
    environment: *backend_environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
