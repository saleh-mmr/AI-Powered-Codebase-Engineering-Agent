name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: repopilot
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: repopilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U repopilot -d repopilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_DATABASE_URL: postgresql+asyncpg://repopilot:ci_password@127.0.0.1:5432/repopilot_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -m 'not integration'
      - run: uv run alembic upgrade head
      - run: uv run alembic current
      - run: uv run pytest -m integration
        env:
          RUN_DB_TESTS: '1'
      - run: docker build -t repopilot-backend:ci .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: docker build -t repopilot-frontend:ci .
